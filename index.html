<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Application Tracker</title>

 
  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.1/dist/full.min.css" rel="stylesheet" />
</head>

<body class="bg-base-200 min-h-screen">

  <div class="container mx-auto px-4 py-8">

    <h1 class="text-3xl font-bold mb-8 text-center">
      Job Application Tracker
    </h1>
<!-- Dashboard -->
    <div class="grid md:grid-cols-3 gap-6 mb-10">

      <div class="card bg-base-100 shadow">
        <div class="card-body text-center">
          <h2 class="font-semibold">Total Jobs</h2>
          <p id="totalCount" class="text-3xl font-bold">8</p>
        </div>
      </div>

      <div class="card bg-base-100 shadow">
        <div class="card-body text-center">
          <h2 class="font-semibold text-info">Interview</h2>
          <p id="interviewCount" class="text-3xl font-bold text-info">0</p>
        </div>
      </div>

      <div class="card bg-base-100 shadow">
        <div class="card-body text-center">
          <h2 class="font-semibold text-error">Rejected</h2>
          <p id="rejectedCount" class="text-3xl font-bold text-error">0</p>
        </div>
      </div>

    </div>
    <!-- Section Header -->
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-2xl font-bold">Available Jobs</h2>
      <span id="tabCount" class="font-semibold">8 Jobs</span>
    </div>
    <!-- Tabs -->
    <div class="tabs tabs-boxed mb-8">
      <button class="tab tab-active" data-tab="all">All</button>
      <button class="tab" data-tab="interview">Interview</button>
      <button class="tab" data-tab="rejected">Rejected</button>
    </div>
